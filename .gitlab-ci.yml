stages:
  - build
  - test
  - publish
  - deploy

variables:
  DOTNET_VERSION: "6.0"
  PROJECT_PATH: "./"   # change if needed
  BUILD_OUTPUT: "publish"

before_script:
  - echo "Using .NET SDK $DOTNET_VERSION"

# 🔷 BUILD
build_job:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:6.0
  script:
    - dotnet restore
    - dotnet build --configuration Release
  artifacts:
    paths:
      - bin/
      - obj/

# 🔷 TEST
test_job:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:6.0
  script:
    - dotnet test --no-build --verbosity normal

# 🔷 PUBLISH
publish_job:
  stage: publish
  image: mcr.microsoft.com/dotnet/sdk:6.0
  script:
    - dotnet publish -c Release -o $BUILD_OUTPUT
  artifacts:
    paths:
      - $BUILD_OUTPUT/

# 🔷 DEPLOY (DEV)
deploy_dev:
  stage: deploy
  environment:
    name: dev
  script:
    - echo "Deploying to DEV environment..."
    # Example: copy files to server (replace with real command)
    # scp -r $BUILD_OUTPUT/* user@dev-server:/var/www/app
  only:
    - develop   # runs only on dev branch